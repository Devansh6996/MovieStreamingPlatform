name: Build and deploy Next.js app to Azure - streamflix-movies

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: streamflix/package-lock.json

      - name: Install dependencies
        working-directory: ./streamflix
        run: npm ci

      - name: Build Next.js application
        working-directory: ./streamflix
        run: npm run build

      - name: Remove development dependencies
        working-directory: ./streamflix
        run: npm prune --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: streamflix-movies
          package: ./streamflix
